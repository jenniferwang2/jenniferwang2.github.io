title: "Jennifer Wang"
tagline: "Security engineering notes"
author: "Jennifer Wang"
email: "jenniferwang669@gmail.com"
github: "jenniferwang12"
linkedin: "jenniferwang12"
url: "https://jenniferwang.github.io"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /log/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

collections:
  writeups:
    output: true
    permalink: /writeups/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: "writeups" }
    values: { layout: "writeup" }
  - scope: { path: "", type: "projects" }
    values: { layout: "writeup" }
  - scope: { path: "", type: "posts" }
    values: { layout: "writeup", kind: "Log" }

exclude:
  - README.md
  - preview.html
  - Gemfile
  - Gemfile.lock
