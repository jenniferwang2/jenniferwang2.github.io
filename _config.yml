title: "Jennifer Wang"
tagline: "Software engineer working in application security"
description: "Jennifer Wang — computing science student at the University of Alberta working in application security. Experience, projects, and writing."
author: "Jennifer Wang"
email: "jennif11@ualberta.ca"

# Handles.
github: "jenniferwang2"
linkedin: "jenniferwang12"

url: "https://jenniferwang2.github.io"
baseurl: ""

# The PDF shown on /resume/, which every Resume button links to.
# Clear this value and the buttons disappear everywhere.
resume_pdf: "/assets/resume.pdf"

# The homepage is one scrolling page; these are anchors into it. A nav item
# whose url has no "#" is treated as a separate page.
nav:
  - label: "Overview"
    url: "/#overview"
  - label: "Experience"
    url: "/#experience"
  - label: "Projects"
    url: "/#projects"
  - label: "Writing"
    url: "/writing/"
  - label: "Contact"
    url: "/#contact"

markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

collections:
  writeups:
    output: true
    permalink: /writing/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: "writeups" }
    values: { layout: "entry", kind: "Writeup" }
  - scope: { path: "", type: "posts" }
    values: { layout: "entry", kind: "Note" }
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
