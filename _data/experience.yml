- role: "Machine Learning Research Intern"
  org: "Alberta Machine Intelligence Institute (Amii)"
  location: "Edmonton, AB"
  start: "Sept 2023"
  end: "Apr 2024"
  summary: >-
    Research engineering on the data pipeline a machine learning group
    depended on.
  highlights:
    - "Led a 3-person effort building a Python and pandas pipeline that turned raw 2D level data into token-labeled datasets, replacing a manual process and cutting preparation time substantially."
    - "Shipped a CLI and notebook interface so researchers could run the pipeline themselves; added caching and batched vectorized operations to reduce processing time and compute cost per run, with pytest coverage to catch silent data-processing errors."
  stack: "Python · pandas · pytest"
