<footer class="footer">
  <div class="wrap footer-inner">
    <p class="footer-name">
      <span>{{ site.author }}</span>
      <span class="footer-year">© {{ 'now' | date: "%Y" }}</span>
    </p>

    <nav class="footer-links" aria-label="Elsewhere">
      <a href="mailto:{{ site.email }}">Email</a>
      {%- if site.github %}<a href="https://github.com/{{ site.github }}" rel="me">GitHub</a>{% endif -%}
      {%- if site.linkedin %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}" rel="me">LinkedIn</a>{% endif -%}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</footer>
