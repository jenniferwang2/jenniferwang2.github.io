{%- comment -%}
One project card. Pass: include.item
{%- endcomment -%}
<a class="card" href="{{ include.item.url | relative_url }}" data-reveal>
  <h3 class="card-title">{{ include.item.title }}</h3>
  <p class="card-body">{{ include.item.summary }}</p>
  <span class="card-foot">
    {%- if include.item.stack %}<span class="card-stack">{{ include.item.stack }}</span>{% endif -%}
    <svg class="card-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</a>
