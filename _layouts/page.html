---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow" data-reveal>{{ page.eyebrow }}</p>{% endif %}
    <h1 data-reveal>{{ page.title }}</h1>
    {%- assign lede = page.lede | default: page.summary %}
    {%- if lede %}<p class="lede" data-reveal>{{ lede }}</p>{% endif %}
  </header>
</div>

{{ content }}
