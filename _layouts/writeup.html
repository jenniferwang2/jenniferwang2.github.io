---
layout: default
---
<article class="shell article">
  <div class="article-head">
    <h1>{{ page.title }}</h1>
    <div class="article-meta">
      <span>{{ page.date | date: "%Y.%m.%d" }}</span>
      {% if page.platform %}<span>{{ page.platform }}</span>{% endif %}
      {% if page.difficulty %}<span>{{ page.difficulty }}</span>{% endif %}
      {% if page.stack %}<span>{{ page.stack }}</span>{% endif %}
    </div>
  </div>

  <div class="prose">
    {{ content }}
  </div>

  {% if page.scope %}
  <p class="scope-note">{{ page.scope }}</p>
  {% endif %}
</article>
