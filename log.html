---
layout: default
title: Log
description: Learning journal and cert progress.
---
<section class="shell band">
  <div class="band-head">
    <h2>Log</h2>
    <span class="count">{{ site.posts.size }} entries</span>
  </div>
  <div class="ledger">
    {% for item in site.posts %}
    <a class="entry" href="{{ item.url | relative_url }}" data-kind="Log">
      <span class="entry-date">{{ item.date | date: "%Y.%m.%d" }}</span>
      <span class="entry-body">
        <span class="entry-title">{{ item.title }}</span>
        {% if item.summary %}<span class="entry-note">{{ item.summary }}</span>{% endif %}
      </span>
      <span class="entry-kind">{{ item.kind | default: 'Log' }}</span>
    </a>
    {% endfor %}
  </div>
</section>
